[workspace]
resolver = "2"
members = ["core", "cli", "app/src-tauri"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Keepsake Atelier"]
repository = "https://github.com/ghostyshell/keepsake-atelier"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
