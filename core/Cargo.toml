[package]
name = "keepsake-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# portable UDF 2.50 image creation (Linux/Windows; macOS uses newfs_udf)
hadris-cd = { version = "2.2", default-features = false, features = ["std", "sync"] }
hadris-udf = { version = "2.2", default-features = false, features = ["std", "write"] }
tracing.workspace = true

# key database fetching / storage
ureq = { version = "2", features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "5"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Power"] }

[build-dependencies]
cc = "1"
vcpkg = "0.2"
pkg-config = "0.3"
