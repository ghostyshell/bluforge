name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, macos, linux or windows"
        type: choice
        options: [all, macos, linux, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler libbluray libaacs libbdplus
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        run: npm ci && npx tauri build --bundles app --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          scripts/bundle-app.sh "$APP"
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-arm64.dmg"
          cargo build --release --target aarch64-apple-darwin -p keepsake-atelier
          tar -czf "dist/keepsake-atelier-${V}-macos-arm64.tar.gz" -C target/aarch64-apple-darwin/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  macos-x64:
    name: macOS x64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler libbluray libaacs libbdplus
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        run: npm ci && npx tauri build --bundles app --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/x86_64-apple-darwin/release/bundle/macos/*.app | head -1)
          scripts/bundle-app.sh "$APP"
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-x64.dmg"
          cargo build --release --target x86_64-apple-darwin -p keepsake-atelier
          tar -czf "dist/keepsake-atelier-${V}-macos-x64.tar.gz" -C target/x86_64-apple-darwin/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*

  linux-x64:
    name: Linux x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libbluray-dev libaacs-dev libbdplus-dev
      - name: Build CLI
        run: cargo build --release -p keepsake-atelier
      - name: Package
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          tar -czf "dist/keepsake-atelier-${V}-linux-x64.tar.gz" -C target/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*

  linux-app:
    name: Linux x64 (AppImage + deb)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev pkg-config \
            libbluray-dev libaacs-dev libbdplus-dev ffmpeg
      - name: Build app
        working-directory: app
        run: |
          mkdir -p src-tauri/resources
          cp /usr/bin/ffmpeg src-tauri/resources/ffmpeg
          cp /usr/bin/ffprobe src-tauri/resources/ffprobe
          npm ci
          npx tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package artifacts
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          DEB=$(ls target/release/bundle/deb/*.deb | head -1)
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          cp "$DEB" "dist/Keepsake-Atelier-${V}-linux-x64.deb"
          cp "$APPIMG" "dist/Keepsake-Atelier-${V}-linux-x64.AppImage"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/*

  windows-app:
    name: Windows x64 (installer)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_ROOT: C:\\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-ntldd
      - name: Bundle the AACS DLLs
        shell: msys2 {0}
        run: |
          mkdir -p app/src-tauri/resources/windows-libs
          cp /mingw64/bin/libaacs-0.dll app/src-tauri/resources/windows-libs/libaacs.dll
          cp /mingw64/bin/libbdplus-0.dll app/src-tauri/resources/windows-libs/libbdplus.dll
          for root in /mingw64/bin/libaacs-0.dll /mingw64/bin/libbdplus-0.dll; do
            ntldd -R "$root" | awk '{ if ($2 == "=>") print $3; else if ($1 ~ /mingw64/) print $1 }' |
            while read -r dll; do
              unix=$(cygpath -u "$dll" 2>/dev/null || true)
              case "$unix" in
                *mingw64*) [ -f "$unix" ] && cp -n "$unix" app/src-tauri/resources/windows-libs/ ;;
              esac
            done
          done
          ls -l app/src-tauri/resources/windows-libs
      - name: vcpkg libbluray
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libbluray --triplet x64-windows-static-md
      - name: Windows ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName app/src-tauri/resources/ffmpeg.exe
          Copy-Item $fp.FullName app/src-tauri/resources/ffprobe.exe
      - name: Point the bundle at the Windows helpers
        shell: bash
        run: |
          python - <<'PY'
          import json
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p))
          r = c["bundle"]["resources"]
          r.pop("resources/ffmpeg", None)
          r.pop("resources/ffprobe", None)
          r["resources/ffmpeg.exe"] = "ffmpeg.exe"
          r["resources/ffprobe.exe"] = "ffprobe.exe"
          import os
          d = "app/src-tauri/resources/windows-libs"
          if os.path.isdir(d):
              for name in os.listdir(d):
                  r[f"resources/windows-libs/{name}"] = f"windows-libs/{name}"
          json.dump(c, open(p, "w"), indent=2)
          open(p, "a").write("\n")
          PY
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package
        shell: pwsh
        run: |
          $V = python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $nsis.FullName "dist/Keepsake-Atelier-$V-windows-x64-setup.exe"
          Get-ChildItem dist | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*

  windows-x64:
    name: Windows x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip
            mingw-w64-x86_64-libbluray
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ntldd
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build CLI
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="$(cygpath "$USERPROFILE")/.cargo/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu -p keepsake-atelier
      - name: Package
        shell: msys2 {0}
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/keepsake-atelier.exe dist/
          if command -v ntldd >/dev/null 2>&1; then
            ntldd -R target/x86_64-pc-windows-gnu/release/keepsake-atelier.exe > /tmp/ntldd.txt 2>&1 || true
            head -20 /tmp/ntldd.txt
            awk '{ if ($2 == "=>") print $3; else if ($1 ~ /mingw64/) print $1 }' /tmp/ntldd.txt |
            while read -r dll; do
              unix=$(cygpath -u "$dll" 2>/dev/null || true)
              case "$unix" in
                *mingw64*)
                  [ -f "$unix" ] && cp -n "$unix" dist/ ;;
              esac
            done
          fi
          cd dist && zip -9 "keepsake-atelier-${V}-windows-x64.zip" *
          ls -lh
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
