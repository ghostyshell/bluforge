name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, macos, linux or windows"
        type: choice
        options: [all, macos, macos-x64, linux, linux-cli, linux-ui, ui, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build disc libraries and ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler bison
          scripts/build-disc-libs.sh
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        env:
          BLURAY_PREFIX: ${{ github.workspace }}/vendor/disc/prefix
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: npm ci && npx tauri build --bundles app --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          BIN="$APP/Contents/MacOS/keepsake-atelier-app"
          if ! otool -L "$BIN" | grep -q "vendor/disc/prefix/lib/libbluray"; then
            echo "the app did not link the custom libbluray" >&2
            otool -L "$BIN" >&2
            exit 1
          fi
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" scripts/bundle-app.sh "$APP"
          for f in "$BIN" "$APP/Contents/Resources/ffmpeg" "$APP/Contents/Resources/ffprobe" "$APP/Contents/Resources/lib/"*.dylib; do
            m=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            [ "$m" = "12.0" ] || { echo "unexpected minos $m for $f" >&2; exit 1; }
          done
          [ "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "12.0" ]
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-arm64.dmg"
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" MACOSX_DEPLOYMENT_TARGET=12.0 \
            cargo build --release --target aarch64-apple-darwin -p keepsake-atelier
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" scripts/bundle-cli.sh \
            target/aarch64-apple-darwin/release/keepsake-atelier dist/cli app/src-tauri/resources
          tar -czf "dist/keepsake-atelier-${V}-macos-arm64.tar.gz" -C dist/cli \
            keepsake-atelier lib ffmpeg ffprobe 00000.jar ffmpeg-LICENSES.txt
          ls -lh dist
      - name: Managed tsMuxeR
        run: |
          dist/cli/keepsake-atelier tsmuxer --install
          dist/cli/keepsake-atelier doctor | tee /tmp/doctor.txt
          grep -Eq "tsMuxeR +ok" /tmp/doctor.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  macos-x64:
    name: macOS x64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' || inputs.platforms == 'macos-x64' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build disc libraries and ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler bison
          scripts/build-disc-libs.sh
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        env:
          BLURAY_PREFIX: ${{ github.workspace }}/vendor/disc/prefix
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: npm ci && npx tauri build --bundles app --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/x86_64-apple-darwin/release/bundle/macos/*.app | head -1)
          BIN="$APP/Contents/MacOS/keepsake-atelier-app"
          if ! otool -L "$BIN" | grep -q "vendor/disc/prefix/lib/libbluray"; then
            echo "the app did not link the custom libbluray" >&2
            otool -L "$BIN" >&2
            exit 1
          fi
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" scripts/bundle-app.sh "$APP"
          for f in "$BIN" "$APP/Contents/Resources/ffmpeg" "$APP/Contents/Resources/ffprobe" "$APP/Contents/Resources/lib/"*.dylib; do
            m=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            [ "$m" = "12.0" ] || { echo "unexpected minos $m for $f" >&2; exit 1; }
          done
          [ "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "12.0" ]
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-x64.dmg"
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" MACOSX_DEPLOYMENT_TARGET=12.0 \
            cargo build --release --target x86_64-apple-darwin -p keepsake-atelier
          BLURAY_PREFIX="$PWD/vendor/disc/prefix" scripts/bundle-cli.sh \
            target/x86_64-apple-darwin/release/keepsake-atelier dist/cli app/src-tauri/resources
          tar -czf "dist/keepsake-atelier-${V}-macos-x64.tar.gz" -C dist/cli \
            keepsake-atelier lib ffmpeg ffprobe 00000.jar ffmpeg-LICENSES.txt
          ls -lh dist
      - name: Managed tsMuxeR has no Intel build
        run: |
          if dist/cli/keepsake-atelier tsmuxer --install; then
            echo "unexpected managed tsMuxeR install on Intel macOS" >&2
            exit 1
          fi
          dist/cli/keepsake-atelier tsmuxer | grep -q "not installed"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*

  linux-x64:
    name: Linux x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' || inputs.platforms == 'linux-cli' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libbluray-dev libaacs-dev libbdplus-dev \
            libgcrypt20-dev libgpg-error-dev openjdk-17-jdk xvfb patchelf \
            build-essential nasm meson ninja-build cmake libtool autoconf automake
      - name: Build bundled ffmpeg
        run: |
          scripts/build-ffmpeg.sh
          app/src-tauri/resources/ffmpeg -hide_banner -demuxers | grep -q dvdvideo
          app/src-tauri/resources/ffmpeg -hide_banner -encoders | grep -q libx265
          app/src-tauri/resources/ffmpeg -version | head -1
          if ldd app/src-tauri/resources/ffmpeg | grep -q "not found"; then
            echo "the bundled ffmpeg has unresolved runtime libraries" >&2
            ldd app/src-tauri/resources/ffmpeg >&2
            exit 1
          fi
      - name: Build CLI
        run: cargo build --release -p keepsake-atelier
      - name: Test core
        run: cargo test -p keepsake-core --lib
      - name: Managed tsMuxeR and an authored ISO
        run: |
          BIN=./target/release/keepsake-atelier
          "$BIN" tsmuxer --install
          "$BIN" doctor | tee /tmp/doctor.txt
          grep -Eq "tsMuxeR +ok" /tmp/doctor.txt
          for name in a b; do
            app/src-tauri/resources/ffmpeg -hide_banner -loglevel error \
              -f lavfi -i testsrc2=size=320x240:rate=24 -t 3 \
              -c:v libx264 -pix_fmt yuv420p "/tmp/$name.mkv"
          done
          "$BIN" author /tmp/a.mkv /tmp/b.mkv --out /tmp/tsmuxer.iso \
            --label TSMUXER --menu
          test -s /tmp/tsmuxer.iso
          "$BIN" disc /tmp/tsmuxer.iso | tee /tmp/disc.txt
          grep -q "titles    : 2" /tmp/disc.txt
          "$BIN" tsmuxer | grep -q "$HOME/.config/keepsake-atelier/bin/tsMuxeR"
      - name: Package
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          scripts/bundle-cli-linux.sh target/release/keepsake-atelier dist/cli \
            app/src-tauri/resources
          tar -czf "dist/keepsake-atelier-${V}-linux-x64.tar.gz" -C dist/cli \
            keepsake-atelier lib ffmpeg ffprobe 00000.jar ffmpeg-LICENSES.txt
          ls -lh dist
      - name: Smoke test the package
        run: |
          rm -rf /tmp/cli-check && mkdir /tmp/cli-check
          tar -xzf dist/*.tar.gz -C /tmp/cli-check
          /tmp/cli-check/keepsake-atelier --version
          /tmp/cli-check/keepsake-atelier libs
          /tmp/cli-check/keepsake-atelier doctor
          docker run --rm -v /tmp/cli-check:/p:ro ubuntu:24.04 bash -c '
            set -e
            /p/keepsake-atelier --version
            /p/keepsake-atelier doctor | tee /tmp/doctor.txt
            grep -q "dvdvideo: yes" /tmp/doctor.txt
            /p/keepsake-atelier libs | tee /tmp/libs.txt
            grep -q "/p/lib/libaacs.so.0" /tmp/libs.txt
            grep -q "/p/lib/libbdplus.so.0" /tmp/libs.txt
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*

  linux-app:
    name: Linux x64 (AppImage + deb)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' || inputs.platforms == 'linux-ui' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev pkg-config \
            libbluray-dev libaacs-dev libbdplus-dev libgcrypt20-dev libgpg-error-dev \
            build-essential nasm meson ninja-build cmake libtool autoconf automake libnuma-dev
      - name: Build bundled ffmpeg
        run: |
          scripts/build-ffmpeg.sh
          app/src-tauri/resources/ffmpeg -hide_banner -demuxers | grep -q dvdvideo
          app/src-tauri/resources/ffmpeg -hide_banner -encoders | grep -q libx265
          app/src-tauri/resources/ffmpeg -version | head -1
          if ldd app/src-tauri/resources/ffmpeg | grep -q "not found"; then
            echo "the bundled ffmpeg has unresolved runtime libraries" >&2
            ldd app/src-tauri/resources/ffmpeg >&2
            exit 1
          fi
          if ldd app/src-tauri/resources/ffmpeg | grep -q libnuma; then
            echo "the bundled ffmpeg still depends on libnuma" >&2
            exit 1
          fi
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package artifacts
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          DEB=$(ls target/release/bundle/deb/*.deb | head -1)
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          cp "$DEB" "dist/Keepsake-Atelier-${V}-linux-x64.deb"
          cp "$APPIMG" "dist/Keepsake-Atelier-${V}-linux-x64.AppImage"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/*

  linux-ui:
    name: Linux desktop UI (Xvfb)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' || inputs.platforms == 'linux-ui' }}
    needs: linux-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-app
          path: dist
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 openbox \
            libegl1 libgl1 libglx-mesa0 libgles2 libopengl0 libnss3 libasound2t64
      - name: Run the window smoke test
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          openbox >/dev/null 2>&1 &
          sleep 2
          dbus-run-session -- scripts/ui-smoke-linux.sh dist/*.AppImage /tmp/ui-linux
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui
          path: /tmp/ui-linux
          if-no-files-found: warn

  menu-check:
    name: BD-J menu render
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk xvfb openbox
      - name: Render the menu
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          openbox >/dev/null 2>&1 &
          sleep 2
          timeout 240 sh scripts/test-menu.sh "" /tmp/keepsake-menu-test
      - name: Upload menu frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-frames
          path: /tmp/keepsake-menu-test/menu-*.png
          if-no-files-found: warn

  ui-check:
    name: UI interaction (Playwright)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' || inputs.platforms == 'ui' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the interaction checks
        run: npm run test:ui
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/test-results
          if-no-files-found: warn

  windows-app:
    name: Windows x64 (installer)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_ROOT: C:\\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-libgcrypt
      - name: Build the AACS helper DLL
        shell: msys2 {0}
        run: |
          mkdir -p app/src-tauri/resources/windows-libs
          gcc -shared -O2 -DBF_AACS_DLL \
            -I core/src -I core/third_party/libaacs \
            core/src/aacs_key.c \
            core/third_party/libaacs/libaacs/crypto.c \
            core/third_party/libaacs/libaacs/mkb.c \
            core/third_party/libaacs/util/strutl.c \
            core/third_party/libaacs/util/logging_stub.c \
            -o app/src-tauri/resources/windows-libs/keepsake-aacs.dll \
            -lgcrypt -lgpg-error -static-libgcc
          ls -l app/src-tauri/resources/windows-libs/keepsake-aacs.dll
      - name: Bundle the AACS DLLs
        shell: msys2 {0}
        run: |
          copy_closure() {
            local src="$1" dest="$2"
            ldd "$src" 2>/dev/null |
              awk '{ if ($2 == "=>") print $3; else if ($1 ~ /^\/mingw64/) print $1 }' |
              while read -r dll; do
                unix=$(cygpath -u "$dll" 2>/dev/null || true)
                case "$unix" in
                  /mingw64/*)
                    if [ -f "$unix" ] && [ ! -f "$dest/$(basename "$unix")" ]; then
                      cp "$unix" "$dest/"
                      copy_closure "$unix" "$dest"
                    fi
                    ;;
                esac
              done
          }
          mkdir -p app/src-tauri/resources/windows-libs
          cp /mingw64/bin/libaacs-0.dll app/src-tauri/resources/windows-libs/libaacs.dll
          cp /mingw64/bin/libbdplus-0.dll app/src-tauri/resources/windows-libs/libbdplus.dll
          copy_closure /mingw64/bin/libaacs-0.dll app/src-tauri/resources/windows-libs
          copy_closure /mingw64/bin/libbdplus-0.dll app/src-tauri/resources/windows-libs
          copy_closure app/src-tauri/resources/windows-libs/keepsake-aacs.dll app/src-tauri/resources/windows-libs
          ls -l app/src-tauri/resources/windows-libs
      - name: vcpkg libbluray
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libbluray --triplet x64-windows-static-md
      - name: Windows ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName app/src-tauri/resources/ffmpeg.exe
          Copy-Item $fp.FullName app/src-tauri/resources/ffprobe.exe
          $demuxers = & $ff.FullName -hide_banner -demuxers 2>&1
          if (-not ($demuxers -match "dvdvideo")) { throw "the bundled ffmpeg lacks the dvdvideo demuxer" }
          $encoders = & $ff.FullName -hide_banner -encoders 2>&1
          foreach ($codec in @("libx264", "libx265")) {
            if (-not ($encoders -match $codec)) { throw "the bundled ffmpeg lacks $codec" }
          }
      - name: Point the bundle at the Windows helpers
        shell: bash
        run: |
          python - <<'PY'
          import json
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p))
          r = c["bundle"]["resources"]
          r.pop("resources/ffmpeg", None)
          r.pop("resources/ffprobe", None)
          r["resources/ffmpeg.exe"] = "ffmpeg.exe"
          r["resources/ffprobe.exe"] = "ffprobe.exe"
          import os
          d = "app/src-tauri/resources/windows-libs"
          if os.path.isdir(d):
              for name in os.listdir(d):
                  r[f"resources/windows-libs/{name}"] = f"windows-libs/{name}"
          json.dump(c, open(p, "w"), indent=2)
          open(p, "a").write("\n")
          PY
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package
        shell: pwsh
        run: |
          $V = python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $nsis.FullName "dist/Keepsake-Atelier-$V-windows-x64-setup.exe"
          Get-ChildItem dist | Format-Table
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $roots = @(
            "$env:LOCALAPPDATA\Keepsake Atelier",
            "$env:LOCALAPPDATA\Programs\Keepsake Atelier",
            "$env:ProgramFiles\Keepsake Atelier",
            "${env:ProgramFiles(x86)}\Keepsake Atelier"
          )
          $exe = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $exe = Get-ChildItem $root -Recurse -Filter "keepsake-atelier-app.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) { break }
            }
          }
          if (-not $exe) { throw "the installer did not place keepsake-atelier-app.exe" }
          $dir = Split-Path $exe.FullName
          foreach ($needed in @("ffmpeg.exe", "ffprobe.exe", "00000.jar", "windows-libs/libaacs.dll", "windows-libs/libbdplus.dll", "windows-libs/keepsake-aacs.dll")) {
            if (-not (Test-Path (Join-Path $dir $needed))) { throw "the installed app is missing $needed" }
          }
          $helper = Join-Path $dir "windows-libs/keepsake-aacs.dll"
          $env:PATH = (Join-Path $dir "windows-libs") + ";" + $env:PATH
          $src = 'using System; using System.Runtime.InteropServices; public static class AacsHelper { [DllImport(@"' + $helper + '")] public static extern int bf_media_key(IntPtr mkb, UIntPtr len, IntPtr dks, int n, IntPtr outmk); }'
          Add-Type -TypeDefinition $src
          $rc = [AacsHelper]::bf_media_key([IntPtr]::Zero, [UIntPtr]::Zero, [IntPtr]::Zero, 0, [IntPtr]::Zero)
          if ($rc -ne 2) { throw "the AACS helper did not load or returned $rc instead of BF_ERR_MKB" }
          Write-Host "AACS helper loaded (bf_media_key -> $rc)"
          Write-Host "installed at $($exe.FullName)"

          # `ProjectDirs::config_dir()` on Windows is
          # %APPDATA%\keepsake-atelier\config. The app reads this before its
          # window opens.
          $cfgDir = Join-Path $env:APPDATA "keepsake-atelier\config"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          '{"mcp_enabled":true,"mcp_port":8848}' |
            Set-Content -Path (Join-Path $cfgDir "config.json") -Encoding utf8

          $app = Start-Process -FilePath $exe.FullName -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement

          $deadline = (Get-Date).AddSeconds(90)
          $win = $null
          $cond = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)
          while ((Get-Date) -lt $deadline -and -not $win) {
            if ($app.HasExited) { throw "the app exited before opening a window (code $($app.ExitCode))" }
            $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
            if (-not $win) { Start-Sleep -Seconds 2 }
          }
          if (-not $win) { throw "the app opened no main window" }
          Write-Host "window: $($win.Current.Name)"

          # The webview content is a UIA subtree; the header trigger is a stable,
          # user-facing control, so finding and invoking it proves the shell
          # rendered and accepts input.
          $btnCond = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::NameProperty, "Open the command palette")
          $btn = $null
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $btn) {
            $btn = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $btnCond)
            if (-not $btn) { Start-Sleep -Seconds 2 }
          }
          if (-not $btn) { throw "the shell did not expose the command trigger" }
          Write-Host "the shell rendered its command trigger"

          $invoke = $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
          $invoke.Invoke()
          Start-Sleep -Seconds 2
          $dlgCond = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::NameProperty, "Command palette")
          $dlg = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dlgCond)
          if (-not $dlg) { throw "the command palette did not open" }
          Write-Host "the command palette opened"

          # MCP answers on loopback once the backend is up.
          $init = $null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not $init) {
            try {
              $init = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8848/mcp" `
                -ContentType "application/json" `
                -Body '{"jsonrpc":"2.0","id":1,"method":"initialize"}'
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $init) { throw "the MCP server did not answer" }
          $tools = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8848/mcp" `
            -ContentType "application/json" `
            -Body '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $count = @($tools.result.tools).Count
          if ($count -lt 10) { throw "expected at least 10 MCP tools, got $count" }
          Write-Host "mcp: $($init.result.serverInfo.name), $count tools"

          try {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 1440, 900
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\ui-windows.png")
            Write-Host "captured ui-windows.png"
          } catch {
            Write-Warning "screen capture failed: $_"
          }
          Stop-Process -Id $app.Id -Force
      - name: Upload the UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui
          path: ui-windows.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*

  windows-x64:
    name: Windows x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip
            mingw-w64-x86_64-libbluray
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build CLI
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="$(cygpath "$USERPROFILE")/.cargo/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu -p keepsake-atelier
      - name: Windows ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName app/src-tauri/resources/ffmpeg.exe
          Copy-Item $fp.FullName app/src-tauri/resources/ffprobe.exe
          $demuxers = & app/src-tauri/resources/ffmpeg.exe -hide_banner -demuxers 2>&1 | Out-String
          if (-not ($demuxers -match "dvdvideo")) { throw "the bundled ffmpeg lacks the dvdvideo demuxer" }
          & app/src-tauri/resources/ffmpeg.exe -version 2>&1 | Select-Object -First 1
      - name: Package
        shell: msys2 {0}
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/keepsake-atelier.exe dist/
          copy_closure() {
            local src="$1" dest="$2"
            ldd "$src" 2>/dev/null |
              awk '{ if ($2 == "=>") print $3; else if ($1 ~ /^\/mingw64/) print $1 }' |
              while read -r dll; do
                unix=$(cygpath -u "$dll" 2>/dev/null || true)
                case "$unix" in
                  /mingw64/*)
                    if [ -f "$unix" ] && [ ! -f "$dest/$(basename "$unix")" ]; then
                      cp "$unix" "$dest/"
                      copy_closure "$unix" "$dest"
                    fi
                    ;;
                esac
              done
          }
          # libaacs and libbdplus are dlopen'ed, so they never appear in the
          # PE import table. Copy them explicitly under the names libbluray
          # looks up, then pull in their own dependency closure.
          cp /mingw64/bin/libaacs-0.dll dist/libaacs.dll
          cp /mingw64/bin/libbdplus-0.dll dist/libbdplus.dll
          copy_closure dist/keepsake-atelier.exe dist
          copy_closure /mingw64/bin/libaacs-0.dll dist
          copy_closure /mingw64/bin/libbdplus-0.dll dist
          # A silent no-libbluray build is the failure mode we just fixed.
          objdump -p dist/keepsake-atelier.exe | grep -qi libbluray \
            || { echo "::error::libbluray is not linked into the Windows CLI"; exit 1; }
          ls dist/libbluray*.dll >/dev/null 2>&1 \
            || { echo "::error::the libbluray DLL closure is missing"; exit 1; }
          for dll in libaacs.dll libbdplus.dll; do
            [ -f "dist/$dll" ] || { echo "::error::missing $dll"; exit 1; }
          done
          # ffmpeg/ffprobe decode and probe every title; the menu JAR authors
          # the BD-J menu. Both sit beside the exe, like the macOS/Linux CLI.
          cp app/src-tauri/resources/ffmpeg.exe app/src-tauri/resources/ffprobe.exe \
             app/src-tauri/resources/00000.jar app/src-tauri/resources/ffmpeg-LICENSES.txt \
             dist/
          for f in ffmpeg.exe ffprobe.exe 00000.jar ffmpeg-LICENSES.txt; do
            [ -f "dist/$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          cd dist && zip -9 "keepsake-atelier-${V}-windows-x64.zip" *
          ls -lh
      - name: Smoke test the CLI
        shell: pwsh
        run: |
          & dist\keepsake-atelier.exe --version
          if ($LASTEXITCODE -ne 0) { throw "keepsake-atelier.exe --version failed" }
          & dist\keepsake-atelier.exe doctor | Tee-Object -FilePath doctor.txt
          if (-not (Select-String -Path doctor.txt -Pattern "dvdvideo: yes")) {
            throw "doctor does not report a bundled ffmpeg with dvdvideo"
          }
          if (-not (Select-String -Path doctor.txt -Pattern "libaacs\s+ok\s+.*libaacs\.dll")) {
            throw "doctor does not report the bundled libaacs"
          }
          if (-not (Select-String -Path doctor.txt -Pattern "burning\s+ok\s+.*IMAPI2")) {
            throw "doctor does not reach the IMAPI2 COM stack"
          }
          & dist\keepsake-atelier.exe libs
          foreach ($f in @("ffmpeg.exe", "ffprobe.exe", "00000.jar")) {
            if (-not (Test-Path "dist\$f")) { throw "missing dist\$f" }
          }

          # The managed tsMuxeR makes authoring work without a system install.
          & dist\keepsake-atelier.exe tsmuxer --install
          if ($LASTEXITCODE -ne 0) { throw "tsmuxer --install failed" }
          & dist\keepsake-atelier.exe doctor | Tee-Object -FilePath doctor2.txt
          if (-not (Select-String -Path doctor2.txt -Pattern "tsMuxeR\s+ok")) {
            throw "doctor does not report the managed tsMuxeR"
          }
          foreach ($name in @("a", "b")) {
            & dist\ffmpeg.exe -hide_banner -loglevel error -f lavfi `
              -i testsrc2=size=320x240:rate=24 -t 3 -c:v libx264 -pix_fmt yuv420p "$name.mkv"
            if ($LASTEXITCODE -ne 0) { throw "ffmpeg could not make $name.mkv" }
          }
          & dist\keepsake-atelier.exe author a.mkv b.mkv --out tsmuxer.iso --label TSMUXER
          if ($LASTEXITCODE -ne 0) { throw "author failed with the managed tsMuxeR" }
          if (-not (Test-Path tsmuxer.iso)) { throw "author wrote no ISO" }
          & dist\keepsake-atelier.exe disc tsmuxer.iso | Tee-Object -FilePath disc.txt
          if (-not (Select-String -Path disc.txt -Pattern "titles\s+:\s+2")) {
            throw "the authored ISO does not list two titles"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
