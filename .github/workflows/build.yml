name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, macos, linux or windows"
        type: choice
        options: [all, macos, linux, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler libbluray libaacs libbdplus libgcrypt
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        run: npm ci && npx tauri build --bundles app --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          scripts/bundle-app.sh "$APP"
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-arm64.dmg"
          cargo build --release --target aarch64-apple-darwin -p keepsake-atelier
          tar -czf "dist/keepsake-atelier-${V}-macos-arm64.tar.gz" -C target/aarch64-apple-darwin/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  macos-x64:
    name: macOS x64 (DMG + CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build ffmpeg
        run: |
          brew install nasm meson cmake ninja pkg-config dylibbundler libbluray libaacs libbdplus libgcrypt
          scripts/build-ffmpeg.sh
      - name: Build app
        working-directory: app
        run: npm ci && npx tauri build --bundles app --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle libraries and DMG
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          APP=$(ls -d target/x86_64-apple-darwin/release/bundle/macos/*.app | head -1)
          scripts/bundle-app.sh "$APP"
          mkdir -p dist
          hdiutil create -volname "Keepsake Atelier" -srcfolder "$APP" -ov -format UDZO "dist/Keepsake-Atelier-${V}-x64.dmg"
          cargo build --release --target x86_64-apple-darwin -p keepsake-atelier
          tar -czf "dist/keepsake-atelier-${V}-macos-x64.tar.gz" -C target/x86_64-apple-darwin/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*

  linux-x64:
    name: Linux x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libbluray-dev libaacs-dev libbdplus-dev libgcrypt20-dev libgpg-error-dev openjdk-17-jdk xvfb
      - name: Build CLI
        run: cargo build --release -p keepsake-atelier
      - name: Test core
        run: cargo test -p keepsake-core --lib
      - name: Package
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          tar -czf "dist/keepsake-atelier-${V}-linux-x64.tar.gz" -C target/release keepsake-atelier
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*

  linux-app:
    name: Linux x64 (AppImage + deb)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev pkg-config \
            libbluray-dev libaacs-dev libbdplus-dev libgcrypt20-dev libgpg-error-dev ffmpeg
      - name: Build app
        working-directory: app
        run: |
          mkdir -p src-tauri/resources
          cp /usr/bin/ffmpeg src-tauri/resources/ffmpeg
          cp /usr/bin/ffprobe src-tauri/resources/ffprobe
          npm ci
          npx tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package artifacts
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          DEB=$(ls target/release/bundle/deb/*.deb | head -1)
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          cp "$DEB" "dist/Keepsake-Atelier-${V}-linux-x64.deb"
          cp "$APPIMG" "dist/Keepsake-Atelier-${V}-linux-x64.AppImage"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/*

  menu-check:
    name: BD-J menu render
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk xvfb openbox
      - name: Render the menu
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          openbox >/dev/null 2>&1 &
          sleep 2
          timeout 240 sh scripts/test-menu.sh "" /tmp/keepsake-menu-test
      - name: Upload menu frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-frames
          path: /tmp/keepsake-menu-test/menu-*.png
          if-no-files-found: warn

  windows-app:
    name: Windows x64 (installer)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_ROOT: C:\\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-libgcrypt
      - name: Build the AACS helper DLL
        shell: msys2 {0}
        run: |
          mkdir -p app/src-tauri/resources/windows-libs
          gcc -shared -O2 -DBF_AACS_DLL \
            -I core/src -I core/third_party/libaacs \
            core/src/aacs_key.c \
            core/third_party/libaacs/libaacs/crypto.c \
            core/third_party/libaacs/libaacs/mkb.c \
            core/third_party/libaacs/util/strutl.c \
            core/third_party/libaacs/util/logging_stub.c \
            -o app/src-tauri/resources/windows-libs/keepsake-aacs.dll \
            -lgcrypt -lgpg-error -static-libgcc
          ls -l app/src-tauri/resources/windows-libs/keepsake-aacs.dll
      - name: Bundle the AACS DLLs
        shell: msys2 {0}
        run: |
          copy_closure() {
            local src="$1" dest="$2"
            ldd "$src" 2>/dev/null |
              awk '{ if ($2 == "=>") print $3; else if ($1 ~ /^\/mingw64/) print $1 }' |
              while read -r dll; do
                unix=$(cygpath -u "$dll" 2>/dev/null || true)
                case "$unix" in
                  /mingw64/*)
                    if [ -f "$unix" ] && [ ! -f "$dest/$(basename "$unix")" ]; then
                      cp "$unix" "$dest/"
                      copy_closure "$unix" "$dest"
                    fi
                    ;;
                esac
              done
          }
          mkdir -p app/src-tauri/resources/windows-libs
          cp /mingw64/bin/libaacs-0.dll app/src-tauri/resources/windows-libs/libaacs.dll
          cp /mingw64/bin/libbdplus-0.dll app/src-tauri/resources/windows-libs/libbdplus.dll
          copy_closure /mingw64/bin/libaacs-0.dll app/src-tauri/resources/windows-libs
          copy_closure /mingw64/bin/libbdplus-0.dll app/src-tauri/resources/windows-libs
          copy_closure app/src-tauri/resources/windows-libs/keepsake-aacs.dll app/src-tauri/resources/windows-libs
          ls -l app/src-tauri/resources/windows-libs
      - name: vcpkg libbluray
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libbluray --triplet x64-windows-static-md
      - name: Windows ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName app/src-tauri/resources/ffmpeg.exe
          Copy-Item $fp.FullName app/src-tauri/resources/ffprobe.exe
          $demuxers = & $ff.FullName -hide_banner -demuxers 2>&1
          if (-not ($demuxers -match "dvdvideo")) { throw "the bundled ffmpeg lacks the dvdvideo demuxer" }
          $encoders = & $ff.FullName -hide_banner -encoders 2>&1
          foreach ($codec in @("libx264", "libx265")) {
            if (-not ($encoders -match $codec)) { throw "the bundled ffmpeg lacks $codec" }
          }
      - name: Point the bundle at the Windows helpers
        shell: bash
        run: |
          python - <<'PY'
          import json
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p))
          r = c["bundle"]["resources"]
          r.pop("resources/ffmpeg", None)
          r.pop("resources/ffprobe", None)
          r["resources/ffmpeg.exe"] = "ffmpeg.exe"
          r["resources/ffprobe.exe"] = "ffprobe.exe"
          import os
          d = "app/src-tauri/resources/windows-libs"
          if os.path.isdir(d):
              for name in os.listdir(d):
                  r[f"resources/windows-libs/{name}"] = f"windows-libs/{name}"
          json.dump(c, open(p, "w"), indent=2)
          open(p, "a").write("\n")
          PY
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package
        shell: pwsh
        run: |
          $V = python -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $nsis.FullName "dist/Keepsake-Atelier-$V-windows-x64-setup.exe"
          Get-ChildItem dist | Format-Table
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $roots = @(
            "$env:LOCALAPPDATA\Keepsake Atelier",
            "$env:LOCALAPPDATA\Programs\Keepsake Atelier",
            "$env:ProgramFiles\Keepsake Atelier",
            "${env:ProgramFiles(x86)}\Keepsake Atelier"
          )
          $exe = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $exe = Get-ChildItem $root -Recurse -Filter "keepsake-atelier-app.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) { break }
            }
          }
          if (-not $exe) { throw "the installer did not place keepsake-atelier-app.exe" }
          $dir = Split-Path $exe.FullName
          foreach ($needed in @("ffmpeg.exe", "ffprobe.exe", "00000.jar", "windows-libs/libaacs.dll", "windows-libs/libbdplus.dll", "windows-libs/keepsake-aacs.dll")) {
            if (-not (Test-Path (Join-Path $dir $needed))) { throw "the installed app is missing $needed" }
          }
          $helper = Join-Path $dir "windows-libs/keepsake-aacs.dll"
          $env:PATH = (Join-Path $dir "windows-libs") + ";" + $env:PATH
          $src = 'using System; using System.Runtime.InteropServices; public static class AacsHelper { [DllImport(@"' + $helper + '")] public static extern int bf_media_key(IntPtr mkb, UIntPtr len, IntPtr dks, int n, IntPtr outmk); }'
          Add-Type -TypeDefinition $src
          $rc = [AacsHelper]::bf_media_key([IntPtr]::Zero, [UIntPtr]::Zero, [IntPtr]::Zero, 0, [IntPtr]::Zero)
          if ($rc -ne 2) { throw "the AACS helper did not load or returned $rc instead of BF_ERR_MKB" }
          Write-Host "AACS helper loaded (bf_media_key -> $rc)"
          Write-Host "installed at $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the app exited during startup (code $($app.ExitCode))" }
          Write-Host "app still running after 15s (pid $($app.Id))"
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*

  windows-x64:
    name: Windows x64 (CLI)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip
            mingw-w64-x86_64-libbluray
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build CLI
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          export PATH="$(cygpath "$USERPROFILE")/.cargo/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu -p keepsake-atelier
      - name: Package
        shell: msys2 {0}
        run: |
          V=$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/keepsake-atelier.exe dist/
          copy_closure() {
            local src="$1" dest="$2"
            ldd "$src" 2>/dev/null |
              awk '{ if ($2 == "=>") print $3; else if ($1 ~ /^\/mingw64/) print $1 }' |
              while read -r dll; do
                unix=$(cygpath -u "$dll" 2>/dev/null || true)
                case "$unix" in
                  /mingw64/*)
                    if [ -f "$unix" ] && [ ! -f "$dest/$(basename "$unix")" ]; then
                      cp "$unix" "$dest/"
                      copy_closure "$unix" "$dest"
                    fi
                    ;;
                esac
              done
          }
          # libaacs and libbdplus are dlopen'ed, so they never appear in the
          # PE import table. Copy them explicitly under the names libbluray
          # looks up, then pull in their own dependency closure.
          cp /mingw64/bin/libaacs-0.dll dist/libaacs.dll
          cp /mingw64/bin/libbdplus-0.dll dist/libbdplus.dll
          copy_closure dist/keepsake-atelier.exe dist
          copy_closure /mingw64/bin/libaacs-0.dll dist
          copy_closure /mingw64/bin/libbdplus-0.dll dist
          # A silent no-libbluray build is the failure mode we just fixed.
          objdump -p dist/keepsake-atelier.exe | grep -qi libbluray \
            || { echo "::error::libbluray is not linked into the Windows CLI"; exit 1; }
          ls dist/libbluray*.dll >/dev/null 2>&1 \
            || { echo "::error::the libbluray DLL closure is missing"; exit 1; }
          for dll in libaacs.dll libbdplus.dll; do
            [ -f "dist/$dll" ] || { echo "::error::missing $dll"; exit 1; }
          done
          cd dist && zip -9 "keepsake-atelier-${V}-windows-x64.zip" *
          ls -lh
      - name: Smoke test the CLI
        shell: pwsh
        run: |
          & dist\keepsake-atelier.exe --version
          if ($LASTEXITCODE -ne 0) { throw "keepsake-atelier.exe --version failed" }
          & dist\keepsake-atelier.exe doctor
          Write-Host "doctor exit: $LASTEXITCODE"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
